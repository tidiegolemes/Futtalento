<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Publicação do painel editorial | FutTalento</title><meta name="description" content="Publicações e notícias adicionais do painel editorial FutTalento."><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="../futtalento-2.css"><link rel="stylesheet" href="blog.css"></head><body><a class="skip" href="#principal">Ir ao conteúdo</a><header class="top"><div class="wrap top-row"><a class="brand" href="../index.html">FUT<b>TALENTO</b></a><nav class="nav"><a href="index.html">Blog</a><a href="../index.html">Início</a></nav></div></header><main class="wrap article" id="principal"><p><a href="index.html">← Voltar ao blog</a></p><h1 id="titulo">Carregando publicação...</h1><p class="meta" id="data"></p><article id="texto" aria-live="polite"></article></main><footer class="footer"><div class="wrap"><p>FutTalento · Operado por EY Agência de Marketing Digital</p></div></footer><script>
(function(){
const id=new URLSearchParams(location.search).get('id');
const title=document.getElementById('titulo'),date=document.getElementById('data'),content=document.getElementById('texto');
if(!id||! /^[a-zA-Z0-9_-]+\.md$/.test(id)){title.textContent='Publicação não encontrada';return}
async function run(){
try{
const res=await fetch('https://raw.githubusercontent.com/tidiegolemes/Futtalento/main/noticias/posts/'+encodeURIComponent(id));
if(!res.ok)throw new Error('não encontrada');
const markdown=await res.text();const match=markdown.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);if(!match)throw new Error('formato inválido');
const body=markdown.slice(match[0].length);const attrs={};match[1].split('\n').forEach(function(line){const i=line.indexOf(':');if(i>0)attrs[line.slice(0,i).trim()]=line.slice(i+1).trim().replace(/^["']|["']$/g,'')});
title.textContent=attrs.title||'Publicação FutTalento';document.title=title.textContent+' | Blog FutTalento';date.textContent=attrs.date?('Publicado em '+attrs.date.slice(0,10)):'';
let buffer=[];function flush(){if(!buffer.length)return;const p=document.createElement('p');p.textContent=buffer.join(' ').trim();content.appendChild(p);buffer=[];}
body.split(/\r?\n/).forEach(function(line){line=line.trim();if(!line){flush();return}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){flush();const node=document.createElement('h'+Math.min(h[1].length+1,4));node.textContent=h[2];content.appendChild(node);}else buffer.push(line)});flush();
}catch(err){title.textContent='Publicação indisponível';content.textContent='Não foi possível abrir esta publicação. Tente novamente mais tarde.';}
}
run();
})();
</script></body></html>
