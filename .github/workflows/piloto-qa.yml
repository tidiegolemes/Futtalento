name: FutTalento Pilot QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show runtime
        run: node --version
      - name: Check backend and client JavaScript
        run: |
          node --check api/_athlete-onboarding.js
          node --check atletas/cadastrar/cadastro.js
          node --check atletas/perfil-gerenciado.js
          node --check sponsor/lucas/gestao/captacao/captacao.js
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run repository regression suite
        run: node --test tests/*.test.js
